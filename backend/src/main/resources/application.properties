# Server Configuration
server.port=${PORT:8080}

# Application Information
spring.application.name=bit-connect-backend

# PostgreSQL Database Configuration (with local development and Neon fallbacks)
spring.datasource.url=${DATABASE_URL:${DB_URL:jdbc:postgresql://localhost:5432/bit_connect}}
spring.datasource.username=${DB_USERNAME:postgres}
spring.datasource.password=${DB_PASSWORD:user}
spring.datasource.driver-class-name=org.postgresql.Driver

# JPA / Hibernate Configuration
spring.jpa.hibernate.ddl-auto=${JPA_DDL_AUTO:update}
spring.jpa.show-sql=${JPA_SHOW_SQL:true}
spring.jpa.properties.hibernate.format_sql=true
spring.jpa.open-in-view=false

# JWT Configuration (for future Auth module)
app.jwt.secret=${JWT_SECRET:404E635266556A586E3272357538782F413F4428472B4B6250645367566B5970}
app.jwt.expiration-ms=${JWT_EXPIRATION_MS:86400000}

# CORS & Frontend URL
app.cors.allowed-origins=${CORS_ALLOWED_ORIGINS:http://localhost:5173,http://localhost:5174,http://localhost:5175,http://localhost:3000,http://127.0.0.1:5173,http://127.0.0.1:5174}
app.frontend.url=${FRONTEND_URL:http://localhost:5173}

# SpringDoc OpenAPI / Swagger UI
springdoc.api-docs.path=/v3/api-docs
springdoc.swagger-ui.path=/swagger-ui.html
springdoc.swagger-ui.operations-sorter=method

# Demo Seeding Controls (Local development defaults)
app.seed.admin-password=${SEED_ADMIN_PASSWORD:Password@123}
app.seed.watchman-password=${SEED_WATCHMAN_PASSWORD:Password@123}
app.seed.faculty-password=${SEED_FACULTY_PASSWORD:Password@123}
app.seed.alumni-password=${SEED_ALUMNI_PASSWORD:Password@123}
app.seed.student-password=${SEED_STUDENT_PASSWORD:Password@123}