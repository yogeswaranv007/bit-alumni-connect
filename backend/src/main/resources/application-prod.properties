# Server Configuration (Render dynamically injects PORT)
server.port=${PORT:8080}

# Application Information
spring.application.name=bit-connect-backend

# PostgreSQL Database Configuration (Neon DATABASE_URL or DB_URL fail-fast)
spring.datasource.url=${DATABASE_URL:${DB_URL:}}
spring.datasource.username=${DB_USERNAME:}
spring.datasource.password=${DB_PASSWORD:}
spring.datasource.driver-class-name=org.postgresql.Driver

# JPA / Hibernate Configuration
spring.jpa.hibernate.ddl-auto=${JPA_DDL_AUTO:update}
spring.jpa.show-sql=false
spring.jpa.properties.hibernate.format_sql=false
spring.jpa.open-in-view=false

# JWT Configuration (Fail-fast in production: NO default)
app.jwt.secret=${JWT_SECRET}
app.jwt.expiration-ms=${JWT_EXPIRATION_MS:86400000}

# CORS & Frontend URL (Fail-fast in production: NO localhost defaults)
app.cors.allowed-origins=${CORS_ALLOWED_ORIGINS}
app.frontend.url=${FRONTEND_URL}

# Demo Seeding Controls (Production: Only seed if explicit password variable is set)
app.seed.admin-password=${SEED_ADMIN_PASSWORD:}
app.seed.watchman-password=${SEED_WATCHMAN_PASSWORD:}
app.seed.faculty-password=${SEED_FACULTY_PASSWORD:}
app.seed.alumni-password=${SEED_ALUMNI_PASSWORD:}
app.seed.student-password=${SEED_STUDENT_PASSWORD:}

# SpringDoc OpenAPI / Swagger UI
springdoc.api-docs.path=/v3/api-docs
springdoc.swagger-ui.path=/swagger-ui.html
springdoc.swagger-ui.operations-sorter=method
